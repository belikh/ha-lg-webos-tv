# Tooling configuration for the bscpylgtv Home Assistant integration repo.
# The [project] table exists only to pin the Python floor for uv; the
# integration itself is not a package (tool.uv.package = false) and its
# canonical version lives in custom_components/bscpylgtv/manifest.json.
[project]
name = "ha-lg-webos-tv"
version = "0.0.0"
description = "LG WebOS TV integration for Home Assistant (HACS custom component)"
requires-python = ">=3.14.2"

# Reproducible test environment: `uv sync` then `uv run pytest`.
# pytest-homeassistant-custom-component pins the Home Assistant version the
# tests run against; async-upnp-client must match the HA ssdp integration's
# requirement (the test ssdp stub imports the component); bscpylgtv must
# match the manifest pin.
[dependency-groups]
dev = [
    "bscpylgtv==0.5.4",
    "pytest-homeassistant-custom-component==0.13.367",
    "async-upnp-client==0.48.1",
    "mypy==2.3.1",
    "ruff==0.16.9",
]

[tool.uv]
# The repository is not an installable package: tests import
# custom_components/ from the working tree.
package = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "ASYNC", "ANN", "D"]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "ANN401",  # Any is needed for voluptuous schema callbacks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # asserts are the point of tests
    "ANN",   # test fixtures are loosely typed on purpose
    "D",     # docstrings are not required in tests
]

[tool.ruff.format]
# Defaults are used as-is; the section is declared for explicitness.

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
files = ["custom_components/bscpylgtv"]
# The integration directory shares its name with the bscpylgtv library;
# without an explicit package base mypy resolves ``bscpylgtv`` to
# custom_components/bscpylgtv (shadowing site-packages) and every
# ``from bscpylgtv import WebOsClient`` fails with attr-defined.
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # sqlitedict's background thread can leave its sqlite connection to the
    # GC when a legacy key file is deliberately corrupt (migration test);
    # the warning's attribution is GC-timing dependent, so it cannot be
    # pinned to one test. Message-scoped: every other ResourceWarning
    # (unclosed sockets, files, sessions) still surfaces.
    "ignore:unclosed database:ResourceWarning",
]
