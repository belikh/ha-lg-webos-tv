# Structure only for the bscpylgtv entity services (AD-14/AC-24):
# every human-readable string lives in translations/en.json.

button:
  target:
    entity:
      integration: bscpylgtv
      domain: media_player
  fields:
    button:
      required: true
      example: "LEFT"
      selector:
        text:

command:
  target:
    entity:
      integration: bscpylgtv
      domain: media_player
  fields:
    command:
      required: true
      example: "system.launcher/open"
      selector:
        text:
    payload:
      example: >-
        target: https://www.google.com
      selector:
        object:

select_sound_output:
  target:
    entity:
      integration: bscpylgtv
      domain: media_player
  fields:
    sound_output:
      required: true
      example: "external_speaker"
      selector:
        text:

launch_app:
  target:
    entity:
      integration: bscpylgtv
      domain: media_player
  fields:
    app_id:
      required: true
      example: "com.webos.app.youtube"
      selector:
        text:
    params:
      example: >-
        target: https://www.youtube.com
      selector:
        object:

take_screenshot:
  target:
    entity:
      integration: bscpylgtv
      domain: media_player
  fields:
    filename:
      example: "www/bscpylgtv_screenshot.jpg"
      selector:
        text:

set_settings:
  target:
    entity:
      integration: bscpylgtv
      domain: media_player
  fields:
    category:
      required: true
      example: "picture"
      selector:
        text:
    settings:
      required: true
      example: >-
        contrast: 50
      selector:
        object:
